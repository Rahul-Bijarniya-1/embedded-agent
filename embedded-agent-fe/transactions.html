<!DOCTYPE html>
<html>
<head>
  <title>Transactions</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="config.js"></script>
  <script src="agent.js"></script>
</head>

<body>
<h1>Transactions (6 months)</h1>

<!-- AI Transactions Assistant: grounded in the rows displayed on this page -->
<div class="section" style="background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); border: 2px solid #3b82f6;">
  <div class="header">
    <h2 style="color: #1e40af;">💬 AI Transactions Assistant</h2>
    <span class="agent-pill">Powered by Gemini</span>
  </div>
  <p style="margin: 10px 0; color: #475569;">Ask about the transactions listed below, or get a summary. Answers use only the rows currently shown on this page.</p>
  <div id="txn-chat"></div>
</div>

<table id="table">
  <tr style="background: #f9f9f9; font-weight: bold;">
    <th>Date</th>
    <th>Category</th>
    <th>Merchant</th>
    <th>Type</th>
    <th>Amount</th>
  </tr>
</table>
<button onclick="next()">Load More</button>

<script>
let page=0;
let allTransactions = [];

function next(){
  fetch(API_BASE + "/transactions?page="+page)
  .then(r=>r.json())
  .then(data=>{
    const t=document.getElementById("table");
    data.forEach(x=>{
      const typeColor = x.type === 'debit' ? '#dc2626' : '#059669';
      const typeSymbol = x.type === 'debit' ? '-' : '+';
      allTransactions.push(x);
      t.innerHTML += `<tr>
        <td>${x.date}</td>
        <td>${x.category}</td>
        <td>${x.merchant}</td>
        <td style="color: ${typeColor}; font-weight: bold;">${x.type.toUpperCase()}</td>
        <td style="color: ${typeColor}; font-weight: bold;">${typeSymbol}₹${x.amount}</td>
      </tr>`;
    });
    page++;
  });
}

next();

// AI assistant: the widget lives in agent.js; this page only says where its data is.
Agent.mountChat(document.getElementById('txn-chat'), {
  page: 'transactions',
  askPath: '/transactions/ask',
  summarizePath: '/transactions/summarize',
  placeholder: 'e.g., What is my total spend? Which category is highest? Summarize these transactions.',
  getPayload: () => (allTransactions.length ? { transactions: allTransactions } : null),
  emptyMessage: 'No transactions are loaded on this page yet.',
});
</script>

</body>
</html>
